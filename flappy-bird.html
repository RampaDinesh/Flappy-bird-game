<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Flappy Dot</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Mono&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a0f;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100dvh;
      overflow: hidden;
      font-family: 'Space Mono', monospace;
    }

    /* Animated star field background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(1px 1px at 20% 30%, rgba(255,255,255,0.4) 0%, transparent 100%),
        radial-gradient(1px 1px at 80% 10%, rgba(255,255,255,0.3) 0%, transparent 100%),
        radial-gradient(1px 1px at 50% 70%, rgba(255,255,255,0.35) 0%, transparent 100%),
        radial-gradient(1px 1px at 10% 90%, rgba(255,255,255,0.2) 0%, transparent 100%),
        radial-gradient(1px 1px at 90% 60%, rgba(255,255,255,0.25) 0%, transparent 100%);
      pointer-events: none;
      z-index: 0;
    }

    #wrapper {
      position: relative;
      z-index: 1;
    }

    canvas {
      display: block;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.04),
        0 20px 60px rgba(0,0,0,0.8),
        0 0 80px rgba(99, 179, 237, 0.05);
    }

    #score-display {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Orbitron', monospace;
      font-weight: 900;
      font-size: clamp(24px, 6vw, 48px);
      color: #fff;
      text-shadow: 0 0 20px rgba(99, 179, 237, 0.8), 0 0 40px rgba(99, 179, 237, 0.4);
      pointer-events: none;
      letter-spacing: 4px;
      opacity: 0;
      transition: opacity 0.3s;
    }

    #score-display.visible { opacity: 1; }
  </style>
</head>
<body>
<div id="wrapper">
  <canvas id="gameCanvas"></canvas>
  <div id="score-display">0</div>
</div>

<script>
// ─────────────────────────────────────────────
//  SETUP
// ─────────────────────────────────────────────
const canvas  = document.getElementById('gameCanvas');
const ctx     = canvas.getContext('2d');
const scoreEl = document.getElementById('score-display');

// Responsive sizing: fill the screen while keeping a nice aspect ratio
function resize() {
  const maxW = Math.min(window.innerWidth  - 16, 420);
  const maxH = Math.min(window.innerHeight - 16, 700);
  // Keep roughly 0.6 aspect ratio (portrait)
  const ratio = 0.6;
  let w = maxW, h = maxW / ratio;
  if (h > maxH) { h = maxH; w = h * ratio; }
  canvas.width  = Math.floor(w);
  canvas.height = Math.floor(h);
  // Reposition score label
  document.getElementById('score-display').style.top = '20px';
}
resize();
window.addEventListener('resize', () => { resize(); });

// ─────────────────────────────────────────────
//  AUDIO – tiny synth sounds via Web Audio API
// ─────────────────────────────────────────────
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx;

function initAudio() {
  if (!audioCtx) audioCtx = new AudioCtx();
}

// Play a simple beep: freq = Hz, type = waveform, duration = seconds
function playSound(freq, type, duration, gain = 0.3) {
  if (!audioCtx) return;
  try {
    const osc = audioCtx.createOscillator();
    const vol = audioCtx.createGain();
    osc.connect(vol);
    vol.connect(audioCtx.destination);
    osc.type      = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    vol.gain.setValueAtTime(gain, audioCtx.currentTime);
    vol.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  } catch(e) {}
}

function sfxFlap()  { playSound(520, 'triangle', 0.12, 0.25); }
function sfxScore() { playSound(880, 'sine',     0.18, 0.2);  }
function sfxDie()   {
  playSound(220, 'sawtooth', 0.3, 0.3);
  setTimeout(() => playSound(160, 'sawtooth', 0.4, 0.3), 100);
}

// ─────────────────────────────────────────────
//  GAME STATE
// ─────────────────────────────────────────────
const STATE = { START: 0, PLAYING: 1, DEAD: 2 };

let state     = STATE.START;
let score     = 0;
let bestScore = 0;
let frame     = 0;      // counts every animation frame
let pipes     = [];
let particles = [];     // death burst particles

// Difficulty ramps up every 10 points
function difficulty() {
  const level = Math.floor(score / 10);
  return {
    pipeSpeed:  2.5 + level * 0.3,
    pipeGap:    Math.max(canvas.height * 0.28 - level * 8, canvas.height * 0.18),
    pipeSpawn:  Math.max(90 - level * 5, 55),  // frames between pipes
  };
}

// ─────────────────────────────────────────────
//  PLAYER
// ─────────────────────────────────────────────
const GRAVITY  = 0.38;   // downward pull per frame
const FLAP_VEL = -7.5;   // upward velocity on tap

const player = {
  x: 0, y: 0, vy: 0,
  r: 0,           // radius (set on resize)
  angle: 0,       // visual tilt
  trail: [],      // position trail for glow effect

  reset() {
    this.x  = canvas.width  * 0.22;
    this.y  = canvas.height * 0.45;
    this.vy = 0;
    this.r  = canvas.width  * 0.055;
    this.angle = 0;
    this.trail = [];
  },

  flap() {
    this.vy = FLAP_VEL;
    sfxFlap();
  },

  update() {
    this.vy    += GRAVITY;
    this.y     += this.vy;
    // Tilt: nose-up on flap, nose-down on fall
    const targetAngle = Math.max(-30, Math.min(70, this.vy * 4));
    this.angle += (targetAngle - this.angle) * 0.15;

    // Track trail positions (keep last 8)
    this.trail.push({ x: this.x, y: this.y });
    if (this.trail.length > 8) this.trail.shift();
  },

  draw() {
    // Draw glowing trail
    for (let i = 0; i < this.trail.length; i++) {
      const t     = i / this.trail.length;
      const alpha = t * 0.18;
      const r     = this.r * (0.3 + t * 0.7);
      ctx.beginPath();
      ctx.arc(this.trail[i].x, this.trail[i].y, r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(99, 179, 237, ${alpha})`;
      ctx.fill();
    }

    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate((this.angle * Math.PI) / 180);

    // Outer glow
    const glow = ctx.createRadialGradient(0, 0, this.r * 0.2, 0, 0, this.r * 1.6);
    glow.addColorStop(0,   'rgba(99, 179, 237, 0.3)');
    glow.addColorStop(1,   'rgba(99, 179, 237, 0)');
    ctx.beginPath();
    ctx.arc(0, 0, this.r * 1.6, 0, Math.PI * 2);
    ctx.fillStyle = glow;
    ctx.fill();

    // Main body gradient
    const grad = ctx.createRadialGradient(-this.r * 0.25, -this.r * 0.25, 0, 0, 0, this.r);
    grad.addColorStop(0,   '#e8f4ff');
    grad.addColorStop(0.4, '#63b3ed');
    grad.addColorStop(1,   '#2b6cb0');
    ctx.beginPath();
    ctx.arc(0, 0, this.r, 0, Math.PI * 2);
    ctx.fillStyle = grad;
    ctx.fill();

    // Highlight
    ctx.beginPath();
    ctx.arc(-this.r * 0.28, -this.r * 0.28, this.r * 0.28, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.fill();

    // Eye
    ctx.beginPath();
    ctx.arc(this.r * 0.32, -this.r * 0.12, this.r * 0.2, 0, Math.PI * 2);
    ctx.fillStyle = '#fff';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(this.r * 0.36, -this.r * 0.1, this.r * 0.1, 0, Math.PI * 2);
    ctx.fillStyle = '#1a202c';
    ctx.fill();

    ctx.restore();
  },

  // Returns true if the player collides with a pipe rect or the floor/ceiling
  collides(pipeRect) {
    // Simple AABB vs circle
    const nearX = Math.max(pipeRect.x, Math.min(this.x, pipeRect.x + pipeRect.w));
    const nearY = Math.max(pipeRect.y, Math.min(this.y, pipeRect.y + pipeRect.h));
    const dx    = this.x - nearX;
    const dy    = this.y - nearY;
    return (dx * dx + dy * dy) < (this.r * 0.85) ** 2;
  }
};

// ─────────────────────────────────────────────
//  PIPES
// ─────────────────────────────────────────────
function spawnPipe() {
  const d       = difficulty();
  const gapY    = canvas.height * 0.15 + Math.random() * (canvas.height * 0.55);
  const pipeW   = canvas.width  * 0.14;
  pipes.push({
    x:        canvas.width,
    gapY:     gapY,
    gapH:     d.pipeGap,
    w:        pipeW,
    passed:   false,     // whether player has scored from this pipe
    hue:      200 + Math.random() * 40, // slight color variation
  });
}

function updatePipes() {
  const d = difficulty();
  // Spawn pipes on a timer
  if (frame % d.pipeSpawn === 0) spawnPipe();

  for (const p of pipes) {
    p.x -= d.pipeSpeed;

    // Check if player passed the pipe midpoint → award point
    if (!p.passed && p.x + p.w < player.x) {
      p.passed = true;
      score++;
      scoreEl.textContent = score;
      sfxScore();
    }
  }

  // Remove pipes that scrolled off screen
  pipes = pipes.filter(p => p.x + p.w > -10);
}

function drawPipe(p) {
  const topH    = p.gapY;                           // top pipe height
  const botY    = p.gapY + p.gapH;                  // bottom pipe top
  const botH    = canvas.height - botY;              // bottom pipe height
  const capH    = canvas.height * 0.04;              // cap height
  const capW    = p.w * 1.18;

  function drawRect(x, y, w, h, hue) {
    // Pipe body gradient
    const grad = ctx.createLinearGradient(x, 0, x + w, 0);
    grad.addColorStop(0,   `hsl(${hue}, 60%, 22%)`);
    grad.addColorStop(0.3, `hsl(${hue}, 55%, 38%)`);
    grad.addColorStop(0.7, `hsl(${hue}, 55%, 28%)`);
    grad.addColorStop(1,   `hsl(${hue}, 60%, 18%)`);

    ctx.beginPath();
    ctx.roundRect(x, y, w, h, 4);
    ctx.fillStyle = grad;
    ctx.fill();

    // Edge highlight
    ctx.beginPath();
    ctx.roundRect(x + 3, y, 4, h, 2);
    ctx.fillStyle = `rgba(255,255,255,0.12)`;
    ctx.fill();
  }

  function drawCap(x, y, w, h, hue) {
    const capX = x - (capW - w) / 2;
    const grad = ctx.createLinearGradient(capX, 0, capX + capW, 0);
    grad.addColorStop(0,   `hsl(${hue}, 60%, 25%)`);
    grad.addColorStop(0.5, `hsl(${hue}, 55%, 42%)`);
    grad.addColorStop(1,   `hsl(${hue}, 60%, 20%)`);
    ctx.beginPath();
    ctx.roundRect(capX, y, capW, h, 5);
    ctx.fillStyle = grad;
    ctx.fill();
  }

  // Glow effect on pipes
  ctx.save();
  ctx.shadowColor  = `hsl(${p.hue}, 80%, 60%)`;
  ctx.shadowBlur   = 14;

  // Top pipe
  drawRect(p.x, 0, p.w, topH, p.hue);
  drawCap(p.x, topH - capH, p.w, capH, p.hue);

  // Bottom pipe
  drawRect(p.x, botY, p.w, botH, p.hue);
  drawCap(p.x, botY, p.w, capH, p.hue);

  ctx.restore();
}

// ─────────────────────────────────────────────
//  PARTICLES (death burst)
// ─────────────────────────────────────────────
function spawnParticles() {
  for (let i = 0; i < 28; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 1.5 + Math.random() * 5;
    particles.push({
      x:     player.x,
      y:     player.y,
      vx:    Math.cos(angle) * speed,
      vy:    Math.sin(angle) * speed - 2,
      life:  1,
      decay: 0.02 + Math.random() * 0.03,
      r:     2 + Math.random() * 4,
      hue:   180 + Math.random() * 60,
    });
  }
}

function updateParticles() {
  for (const p of particles) {
    p.x    += p.vx;
    p.y    += p.vy;
    p.vy   += 0.15;   // gravity on particles
    p.life -= p.decay;
  }
  particles = particles.filter(p => p.life > 0);
}

function drawParticles() {
  for (const p of particles) {
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI * 2);
    ctx.fillStyle = `hsla(${p.hue}, 90%, 70%, ${p.life})`;
    ctx.fill();
  }
}

// ─────────────────────────────────────────────
//  SCROLLING BACKGROUND LAYERS
// ─────────────────────────────────────────────
let bgOffset = 0;

function drawBackground() {
  // Deep space gradient
  const bg = ctx.createLinearGradient(0, 0, 0, canvas.height);
  bg.addColorStop(0,   '#060611');
  bg.addColorStop(0.5, '#0d1017');
  bg.addColorStop(1,   '#060a12');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Scrolling star dots (parallax layers)
  const layers = [
    { speed: 0.2, count: 30, size: 0.8, alpha: 0.3 },
    { speed: 0.5, count: 20, size: 1.2, alpha: 0.5 },
    { speed: 0.9, count: 12, size: 1.8, alpha: 0.7 },
  ];

  for (const layer of layers) {
    // Use deterministic positions seeded by layer index
    for (let i = 0; i < layer.count; i++) {
      // Simple LCG pseudo-random seeded by i and layer.count
      const seed1 = ((i * 6271 + layer.count * 397) % 1000) / 1000;
      const seed2 = ((i * 3517 + layer.count * 211) % 1000) / 1000;
      const x = ((seed1 * canvas.width  - bgOffset * layer.speed * canvas.width * 0.01 + canvas.width) % canvas.width + canvas.width) % canvas.width;
      const y = seed2 * canvas.height;
      ctx.beginPath();
      ctx.arc(x, y, layer.size, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(200, 210, 255, ${layer.alpha})`;
      ctx.fill();
    }
  }

  // Floor & ceiling subtle lines
  ctx.fillStyle = 'rgba(99, 179, 237, 0.06)';
  ctx.fillRect(0, 0, canvas.width, 2);
  ctx.fillRect(0, canvas.height - 2, canvas.width, 2);
}

// ─────────────────────────────────────────────
//  OVERLAY SCREENS
// ─────────────────────────────────────────────
function drawStartScreen() {
  // Semi-dark overlay
  ctx.fillStyle = 'rgba(6, 6, 17, 0.7)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  const cx = canvas.width  / 2;
  const cy = canvas.height / 2;

  // Title
  ctx.save();
  ctx.textAlign    = 'center';
  ctx.textBaseline = 'middle';

  ctx.font      = `900 ${Math.floor(canvas.width * 0.12)}px 'Orbitron', monospace`;
  ctx.fillStyle = '#63b3ed';
  ctx.shadowColor = '#63b3ed';
  ctx.shadowBlur  = 30;
  ctx.fillText('FLAPPY', cx, cy - canvas.height * 0.14);

  ctx.font      = `900 ${Math.floor(canvas.width * 0.14)}px 'Orbitron', monospace`;
  ctx.fillStyle = '#e8f4ff';
  ctx.shadowColor = '#e8f4ff';
  ctx.shadowBlur  = 20;
  ctx.fillText('DOT', cx, cy - canvas.height * 0.02);

  // Animated pulse hint
  const pulse = 0.7 + 0.3 * Math.sin(Date.now() * 0.004);
  ctx.font      = `${Math.floor(canvas.width * 0.045)}px 'Space Mono', monospace`;
  ctx.fillStyle = `rgba(200, 220, 255, ${pulse})`;
  ctx.shadowBlur = 0;
  ctx.fillText('tap / click to fly', cx, cy + canvas.height * 0.14);

  ctx.font      = `${Math.floor(canvas.width * 0.036)}px 'Space Mono', monospace`;
  ctx.fillStyle = 'rgba(150,170,200,0.7)';
  ctx.fillText('avoid the pillars', cx, cy + canvas.height * 0.22);

  ctx.restore();
}

function drawGameOver() {
  ctx.fillStyle = 'rgba(6, 6, 17, 0.78)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  const cx = canvas.width  / 2;
  const cy = canvas.height / 2;

  ctx.save();
  ctx.textAlign    = 'center';
  ctx.textBaseline = 'middle';

  ctx.font      = `900 ${Math.floor(canvas.width * 0.1)}px 'Orbitron', monospace`;
  ctx.fillStyle = '#fc8181';
  ctx.shadowColor = '#fc8181';
  ctx.shadowBlur  = 25;
  ctx.fillText('GAME OVER', cx, cy - canvas.height * 0.16);

  // Score
  ctx.shadowBlur = 0;
  ctx.font      = `${Math.floor(canvas.width * 0.05)}px 'Space Mono', monospace`;
  ctx.fillStyle = 'rgba(200,220,255,0.8)';
  ctx.fillText(`score  ${score}`, cx, cy - canvas.height * 0.04);
  ctx.fillText(`best   ${bestScore}`, cx, cy + canvas.height * 0.04);

  // Restart button
  const btnW = canvas.width  * 0.55;
  const btnH = canvas.height * 0.09;
  const btnX = cx - btnW / 2;
  const btnY = cy + canvas.height * 0.14;

  const btnGrad = ctx.createLinearGradient(btnX, btnY, btnX, btnY + btnH);
  btnGrad.addColorStop(0, '#3182ce');
  btnGrad.addColorStop(1, '#2b6cb0');
  ctx.beginPath();
  ctx.roundRect(btnX, btnY, btnW, btnH, 10);
  ctx.fillStyle = btnGrad;
  ctx.fill();

  ctx.fillStyle = '#e8f4ff';
  ctx.font      = `700 ${Math.floor(canvas.width * 0.05)}px 'Orbitron', monospace`;
  ctx.fillText('RESTART', cx, btnY + btnH / 2);

  ctx.restore();
}

// ─────────────────────────────────────────────
//  GAME FLOW
// ─────────────────────────────────────────────
function startGame() {
  score      = 0;
  frame      = 0;
  pipes      = [];
  particles  = [];
  bgOffset   = 0;
  player.reset();

  scoreEl.textContent = '0';
  scoreEl.classList.add('visible');

  state = STATE.PLAYING;
}

function gameOver() {
  if (score > bestScore) bestScore = score;
  spawnParticles();
  sfxDie();
  scoreEl.classList.remove('visible');
  state = STATE.DEAD;
}

// Check if click/tap hit the restart button on game-over screen
function hitRestartBtn(px, py) {
  const cx   = canvas.width  / 2;
  const cy   = canvas.height / 2;
  const btnW = canvas.width  * 0.55;
  const btnH = canvas.height * 0.09;
  const btnX = cx - btnW / 2;
  const btnY = cy + canvas.height * 0.14;
  return px >= btnX && px <= btnX + btnW && py >= btnY && py <= btnY + btnH;
}

function handleInput(clientX, clientY) {
  initAudio();
  const rect = canvas.getBoundingClientRect();
  const px   = (clientX - rect.left) * (canvas.width  / rect.width);
  const py   = (clientY - rect.top)  * (canvas.height / rect.height);

  if (state === STATE.START) {
    startGame();
  } else if (state === STATE.PLAYING) {
    player.flap();
  } else if (state === STATE.DEAD) {
    if (hitRestartBtn(px, py)) startGame();
  }
}

canvas.addEventListener('click',     e => handleInput(e.clientX, e.clientY));
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  const t = e.touches[0];
  handleInput(t.clientX, t.clientY);
}, { passive: false });

// Space / Up arrow
document.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp') {
    e.preventDefault();
    handleInput(canvas.getBoundingClientRect().left + canvas.width / 2,
                canvas.getBoundingClientRect().top  + canvas.height / 2);
  }
});

// ─────────────────────────────────────────────
//  MAIN GAME LOOP
// ─────────────────────────────────────────────
function update() {
  if (state === STATE.PLAYING) {
    frame++;
    bgOffset++;

    player.update();
    updatePipes();

    // Floor / ceiling collision
    if (player.y - player.r < 0 || player.y + player.r > canvas.height) {
      gameOver();
      return;
    }

    // Pipe collision
    for (const p of pipes) {
      const topRect = { x: p.x, y: 0,        w: p.w, h: p.gapY           };
      const botRect = { x: p.x, y: p.gapY + p.gapH, w: p.w, h: canvas.height };
      if (player.collides(topRect) || player.collides(botRect)) {
        gameOver();
        return;
      }
    }
  }

  if (state === STATE.DEAD) {
    updateParticles();
    bgOffset++;
  }
}

function draw() {
  drawBackground();

  if (state === STATE.START) {
    // Draw an idle floating player on the start screen
    player.reset();
    player.y = canvas.height * 0.45 + Math.sin(Date.now() * 0.002) * 12;
    player.draw();
    drawStartScreen();
    return;
  }

  // Draw pipes
  for (const p of pipes) drawPipe(p);

  // Draw player (or particles after death)
  if (state === STATE.PLAYING) {
    player.draw();
  } else if (state === STATE.DEAD) {
    drawParticles();
    drawGameOver();
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

// Kick off
loop();
</script>
</body>
</html>
